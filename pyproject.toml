[project]
name = "facet"
version = "0.1.0"
description = "Facet — a local knowledge base powered by RAG"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0,<2.11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0,<0.7.0",
    # Chroma 0.6 still calls the legacy three-argument posthog.capture API.
    # Newer posthog releases emit telemetry errors even when telemetry is disabled.
    "posthog>=2.4.0,<4.0.0",
    "openai>=1.10.0,<2.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "markdown>=3.6",
    "charset-normalizer>=3.3.0,<4.0.0",
    "aiofiles>=24.1.0",
    "sse-starlette>=2.0.0",
    "trafilatura>=1.8.0",
    "jieba>=0.42.1",
    "rank_bm25>=0.2.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pip-audit>=2.9.0",
]
reranker = [
    "torch>=2.2.0",
    "transformers>=4.51.0",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
facet = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
